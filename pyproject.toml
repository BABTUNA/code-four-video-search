[project]
name = "c4search"
version = "0.1.0"
description = "Natural-language search over body-worn camera footage"
requires-python = ">=3.12"
dependencies = [
    "clip",
    "httpx>=0.28.1",
    "mlx-whisper>=0.4.3",
    "numpy>=2",
    "ocrmac>=1.0.1",
    "panns-inference>=0.1.1",
    "pillow>=12.3.0",
    "pyyaml>=6",
    "scipy>=1.18.1",
    "senko>=0.1.0",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
    "transformers>=5.16.1",
    "typer>=0.12",
    "ultralytics>=8.4.131",
]

[project.scripts]
c4 = "c4search.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/c4search"]

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git" }
