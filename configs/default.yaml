# The wiring diagram: each entry names a registered implementation plus its
# options. Swapping a component is a one-line change here.

data_dir: data

# Extractors run in order during `c4 ingest`; entries are added as each
# extractor lands. Each entry is {impl: <name>, ...options}.
extractors:
  - impl: transcribe
    model: mlx-community/whisper-large-v3-turbo
  - impl: diarize
  - impl: frames
    model: google/siglip2-base-patch16-256
  - impl: detect
    model: yolov8s-worldv2.pt
