# Ablation rung 1: transcript search only - the "what deployed bodycam
# tooling does" baseline. No visual/audio arms, no verification.
data_dir: data
retrieval:
  modalities: [transcript, speaker_turn]
  frames: false
  audio: false
planner: {enabled: true, model: google/gemini-3.5-flash-lite}
verifier: {enabled: false}
