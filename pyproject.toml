[project]
name = "c4search"
version = "0.1.0"
description = "Natural-language search over body-worn camera footage"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
c4 = "c4search.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/c4search"]
